<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dealer Piezas PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f9; padding-bottom: 50px; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button.add-btn { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
        
        .order-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 8px solid #ccc; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        /* Colores por estado */
        .hoy { border-left-color: #d93025; background: #fff5f5; } /* Rojo si es hoy */
        .futuro { border-left-color: #34a853; } /* Verde si es futuro */
        
        .order-card h3 { margin: 0 0 5px 0; color: #1a73e8; }
        .info { font-size: 0.9rem; color: #555; margin: 3px 0; }
        .date-label { display: inline-block; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-top: 5px; }
        .hoy .date-label { background: #d93025; color: white; }
        .del-btn { position: absolute; right: 10px; top: 10px; color: #999; border: none; background: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="header">CONTROL DE ENTREGAS</div>

<div class="container">
    <div class="card">
        <input type="text" id="taller" placeholder="Nombre del Taller">
        <input type="text" id="pedido" placeholder="Número de Pedido">
        <input type="text" id="po" placeholder="Número de PO#">
        <input type="date" id="fecha">
        <button class="add-btn" onclick="saveOrder()">Guardar y Programar Aviso</button>
    </div>

    <div id="orderList"></div>
</div>

<script>
    // Solicitar permiso de notificaciones al cargar
    if ("Notification" in window) {
        Notification.requestPermission();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
    }

    function saveOrder() {
        const taller = document.getElementById('taller').value;
        const pedido = document.getElementById('pedido').value;
        const po = document.getElementById('po').value;
        const fecha = document.getElementById('fecha').value;

        if(!taller || !pedido || !fecha) return alert("Completa los datos");

        const order = { taller, pedido, po, fecha, id: Date.now() };
        let orders = JSON.parse(localStorage.getItem('pwa_orders')) || [];
        orders.push(order);
        localStorage.setItem('pwa_orders', JSON.stringify(orders));
        
        document.getElementById('taller').value = '';
        document.getElementById('pedido').value = '';
        document.getElementById('po').value = '';
        
        render();
        alert("Orden guardada. La app te avisará el día de la entrega si está abierta.");
    }

    function checkNotifications(orders) {
        const hoy = new Date().toISOString().split('T')[0];
        orders.forEach(o => {
            if (o.fecha === hoy) {
                if (Notification.permission === "granted") {
                    new Notification("¡Entrega para HOY!", {
                        body: `Taller: ${o.taller} | Orden: ${o.pedido}`,
                        icon: "https://cdn-icons-png.flaticon.com/512/1554/1554401.png"
                    });
                }
            }
        });
    }

    function render() {
        const list = document.getElementById('orderList');
        const orders = JSON.parse(localStorage.getItem('pwa_orders')) || [];
        const hoyStr = new Date().toISOString().split('T')[0];
        
        list.innerHTML = '<h4>Lista de Órdenes</h4>';
        
        orders.sort((a,b) => new Date(a.fecha) - new Date(b.fecha)).forEach(o => {
            const esHoy = o.fecha === hoyStr;
            const claseColor = esHoy ? 'hoy' : 'futuro';

            list.innerHTML += `
                <div class="order-card ${claseColor}">
                    <button class="del-btn" onclick="deleteOrder(${o.id})">×</button>
                    <h3>${o.taller}</h3>
                    <div class="info"><b>Pedido:</b> ${o.pedido}</div>
                    <div class="info"><b>PO#:</b> ${o.po}</div>
                    <div class="date-label">📅 Entrega: ${o.fecha} ${esHoy ? '- ¡ES HOY!' : ''}</div>
                </div>
            `;
        });
        
        if(orders.length > 0) checkNotifications(orders);
    }

    function deleteOrder(id) {
        if(confirm("¿Borrar orden?")){
            let orders = JSON.parse(localStorage.getItem('pwa_orders')).filter(o => o.id !== id);
            localStorage.setItem('pwa_orders', JSON.stringify(orders));
            render();
        }
    }

    window.onload = render;
</script>
</body>
</html>
